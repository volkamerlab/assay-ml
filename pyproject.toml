[project]
name = "assay-ml"
version = "0.1.0"
description = "Relative prediction models for molecular data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "distinctipy>=1.3.4",
    "fair-esm>=2.0.0",
    "flaml[automl]>=2.3.6",
    "ipywidgets>=8.1.5",
    "jupyterlab>=4.3.5",
    "lightgbm>=4.6.0",
    "mypy>=1.15.0",
    "pandas>=2.2.3",
    "portalocker>=3.2.0",
    "pytest>=8.4.2",
    "rdkit>=2024.9.4",
    "ruff>=0.9.4",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "torch>=2.6.0",
    "torcheval>=0.0.7",
    "tqdm>=4.67.1",
    "transformers>=4.56.1",
    "umap-learn>=0.5.7",
]

[tool.setuptools]
packages = ["dti"]
